# ============================================================
#  CONCREET — NETLIFY CONFIGURATION
# ============================================================
#  The site is plain HTML with no build step, so there is no
#  build command: the repository root is published as-is.

[build]
  publish = "."

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# ---------- caching ----------
# HTML must revalidate so price and copy edits go live at once.
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Images and scripts are content-addressed by the Image CDN or
# change rarely, so they can sit in the browser cache for a year
# while the CDN revalidates in the background.
[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, stale-while-revalidate=86400"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=86400"

# ---------- security ----------
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"

# The admin editor is gated only in the browser, so at minimum
# keep it out of search results.
[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
